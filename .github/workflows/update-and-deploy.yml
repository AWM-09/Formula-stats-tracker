name: Update Formula Stats and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: formula-stats-pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript
        run: node --check app.js && node --check scripts/fetch-f1-data.js
      - name: Fetch and cache F1 historical data
        run: node scripts/fetch-f1-data.js
      - name: Verify generated season files
        shell: bash
        run: |
          set -euo pipefail
          test -s data/f1/1950.json
          test -s data/f1/$(date -u +%Y).json
          node -e "const x=require('./data/f1/1950.json'); if(x.season!==1950 || !Array.isArray(x.races)) process.exit(1); console.log('1950 archive verified:',x.races.length,'race weekends')"
      - name: Save refreshed data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/f1
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Formula 1 data [skip ci]"
            git push
          else
            echo "No new data changes to commit."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
